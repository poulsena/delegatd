name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release tag
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Fetch main
        run: git fetch origin '+refs/heads/main:refs/remotes/origin/main'
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Verify signed release tag
        run: scripts/verify-release-tag.sh "$GITHUB_REF_NAME" origin/main
      - name: Run repository verification
        run: make verify

  package:
    name: Package release (${{ matrix.goos }}-${{ matrix.goarch }})
    needs: verify
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Package release target
        env:
          VERSION: ${{ github.ref_name }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          OUT_DIR: .cache/release/${{ matrix.goos }}-${{ matrix.goarch }}
        run: |
          VERSION="${VERSION#v}"
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export VERSION SOURCE_DATE_EPOCH
          mkdir -p "$OUT_DIR"
          scripts/package-release.sh
      - name: Upload release target
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: .cache/release/${{ matrix.goos }}-${{ matrix.goarch }}/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish release
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Set release version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Download release targets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: .cache/release
          merge-multiple: true
      - name: Validate release target set and create checksums
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          expected=(
            "delegatd_${version}_darwin_amd64.tar.gz"
            "delegatd_${version}_darwin_amd64.spdx.json"
            "delegatd_${version}_darwin_arm64.tar.gz"
            "delegatd_${version}_darwin_arm64.spdx.json"
            "delegatd_${version}_linux_amd64.tar.gz"
            "delegatd_${version}_linux_amd64.spdx.json"
            "delegatd_${version}_linux_arm64.tar.gz"
            "delegatd_${version}_linux_arm64.spdx.json"
            "delegatd_${version}_windows_amd64.zip"
            "delegatd_${version}_windows_amd64.spdx.json"
            "delegatd_${version}_windows_arm64.zip"
            "delegatd_${version}_windows_arm64.spdx.json"
          )
          expected_joined=" ${expected[*]} "
          count=0
          for path in .cache/release/*; do
            [ -e "$path" ] || [ -L "$path" ] || continue
            name=${path##*/}
            case "$expected_joined" in
              *" $name "*) ;;
              *) printf 'unexpected release asset: %s\n' "$name" >&2; exit 1 ;;
            esac
            count=$((count + 1))
          done
          [ "$count" -eq 12 ] || { printf 'expected 12 release assets, got %s\n' "$count" >&2; exit 1; }
          for name in "${expected[@]}"; do
            [ -f ".cache/release/$name" ] || { printf 'missing release asset: %s\n' "$name" >&2; exit 1; }
          done
          go run ./internal/releasetool checksums --dir .cache/release --output .cache/release/SHA256SUMS
      - name: Inspect existing release
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fail() { printf 'release preflight: %s\n' "$1" >&2; exit 1; }
          version="${GITHUB_REF_NAME#v}"
          expected=(
            "delegatd_${version}_darwin_amd64.tar.gz"
            "delegatd_${version}_darwin_amd64.spdx.json"
            "delegatd_${version}_darwin_arm64.tar.gz"
            "delegatd_${version}_darwin_arm64.spdx.json"
            "delegatd_${version}_linux_amd64.tar.gz"
            "delegatd_${version}_linux_amd64.spdx.json"
            "delegatd_${version}_linux_arm64.tar.gz"
            "delegatd_${version}_linux_arm64.spdx.json"
            "delegatd_${version}_windows_amd64.zip"
            "delegatd_${version}_windows_amd64.spdx.json"
            "delegatd_${version}_windows_arm64.zip"
            "delegatd_${version}_windows_arm64.spdx.json"
            "SHA256SUMS"
          )
          expected_joined=" ${expected[*]} "
          release_url="repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}"
          response=''
          if response=$(gh api "$release_url" --include 2>&1); then
            release_id=$(gh api "$release_url" --jq .id)
            assets_url="repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets"
            draft=$(gh api "$release_url" --jq .draft)
            immutable=$(gh api "$release_url" --jq .immutable)
            asset_names=$(gh api "$assets_url" --paginate --jq '.[].name')
            count=0
            while IFS= read -r name; do
              [ -n "$name" ] || continue
              case "$expected_joined" in
                *" $name "*) ;;
                *) [ "$draft" = true ] && fail "unexpected draft asset $name"; fail "unexpected published asset $name" ;;
              esac
              count=$((count + 1))
            done <<EOF
          $asset_names
          EOF
            if [ "$draft" = true ]; then
              printf 'complete=false\n' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            [ "$immutable" = true ] || fail 'published release is not immutable'
            [ "$count" -eq 13 ] || fail "immutable release has $count assets, expected 13"
            for name in "${expected[@]}"; do
              found=0
              while IFS= read -r candidate; do
                [ "$candidate" = "$name" ] && found=1
              done <<EOF
          $asset_names
          EOF
              [ "$found" -eq 1 ] || fail "immutable release is missing $name"
              remote=$(gh api "$assets_url" --paginate --jq ".[] | select(.name == \"$name\") | .digest")
              [ -n "$remote" ] || fail "missing GitHub digest for $name"
              remote=${remote#sha256:}
              local=$(sha256sum ".cache/release/$name" | cut -d ' ' -f1)
              [ "$remote" = "$local" ] || fail "published digest mismatch for $name"
            done
            printf 'complete=true\n' >> "$GITHUB_OUTPUT"
          else
            http_status=$(printf '%s\n' "$response" | awk '$1 ~ /^HTTP/ { status = $2 } END { print status }')
            if [ "$http_status" = 404 ]; then
              printf 'complete=false\n' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            printf '%s\n' "$response" >&2
            fail "release lookup failed with HTTP ${http_status:-unknown}"
          fi
      - name: Prepare release draft
        if: steps.preflight.outputs.complete != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fail() { printf 'release draft: %s\n' "$1" >&2; exit 1; }
          version="${GITHUB_REF_NAME#v}"
          expected=(
            "delegatd_${version}_darwin_amd64.tar.gz"
            "delegatd_${version}_darwin_amd64.spdx.json"
            "delegatd_${version}_darwin_arm64.tar.gz"
            "delegatd_${version}_darwin_arm64.spdx.json"
            "delegatd_${version}_linux_amd64.tar.gz"
            "delegatd_${version}_linux_amd64.spdx.json"
            "delegatd_${version}_linux_arm64.tar.gz"
            "delegatd_${version}_linux_arm64.spdx.json"
            "delegatd_${version}_windows_amd64.zip"
            "delegatd_${version}_windows_amd64.spdx.json"
            "delegatd_${version}_windows_arm64.zip"
            "delegatd_${version}_windows_arm64.spdx.json"
            "SHA256SUMS"
          )
          expected_joined=" ${expected[*]} "
          release_url="repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}"
          response=''
          if response=$(gh api "$release_url" --include 2>&1); then
            draft=$(gh api "$release_url" --jq .draft)
            [ "$draft" = true ] || fail 'release became published before attestation'
            release_id=$(gh api "$release_url" --jq .id)
            assets_url="repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets"
            asset_names=$(gh api "$assets_url" --paginate --jq '.[].name')
            while IFS= read -r name; do
              [ -n "$name" ] || continue
              case "$expected_joined" in
                *" $name "*) ;;
                *) fail "unexpected draft asset $name" ;;
              esac
            done <<EOF
          $asset_names
          EOF
          else
            http_status=$(printf '%s\n' "$response" | awk '$1 ~ /^HTTP/ { status = $2 } END { print status }')
            if [ "$http_status" = 404 ]; then
              gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --notes-from-tag
            else
              printf '%s\n' "$response" >&2
              fail "release lookup failed with HTTP ${http_status:-unknown}"
            fi
          fi
          release_url="repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}"
          draft=$(gh api "$release_url" --jq .draft)
          [ "$draft" = true ] || fail 'release draft was not available before attestation'
      - name: Attest release assets
        if: steps.preflight.outputs.complete != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            .cache/release/delegatd_${{ steps.version.outputs.value }}_darwin_amd64.tar.gz
            .cache/release/delegatd_${{ steps.version.outputs.value }}_darwin_amd64.spdx.json
            .cache/release/delegatd_${{ steps.version.outputs.value }}_darwin_arm64.tar.gz
            .cache/release/delegatd_${{ steps.version.outputs.value }}_darwin_arm64.spdx.json
            .cache/release/delegatd_${{ steps.version.outputs.value }}_linux_amd64.tar.gz
            .cache/release/delegatd_${{ steps.version.outputs.value }}_linux_amd64.spdx.json
            .cache/release/delegatd_${{ steps.version.outputs.value }}_linux_arm64.tar.gz
            .cache/release/delegatd_${{ steps.version.outputs.value }}_linux_arm64.spdx.json
            .cache/release/delegatd_${{ steps.version.outputs.value }}_windows_amd64.zip
            .cache/release/delegatd_${{ steps.version.outputs.value }}_windows_amd64.spdx.json
            .cache/release/delegatd_${{ steps.version.outputs.value }}_windows_arm64.zip
            .cache/release/delegatd_${{ steps.version.outputs.value }}_windows_arm64.spdx.json
            .cache/release/SHA256SUMS
      - name: Upload and publish release
        if: steps.preflight.outputs.complete != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fail() { printf 'release publish: %s\n' "$1" >&2; exit 1; }
          version="${GITHUB_REF_NAME#v}"
          expected=(
            "delegatd_${version}_darwin_amd64.tar.gz"
            "delegatd_${version}_darwin_amd64.spdx.json"
            "delegatd_${version}_darwin_arm64.tar.gz"
            "delegatd_${version}_darwin_arm64.spdx.json"
            "delegatd_${version}_linux_amd64.tar.gz"
            "delegatd_${version}_linux_amd64.spdx.json"
            "delegatd_${version}_linux_arm64.tar.gz"
            "delegatd_${version}_linux_arm64.spdx.json"
            "delegatd_${version}_windows_amd64.zip"
            "delegatd_${version}_windows_amd64.spdx.json"
            "delegatd_${version}_windows_arm64.zip"
            "delegatd_${version}_windows_arm64.spdx.json"
            "SHA256SUMS"
          )
          expected_joined=" ${expected[*]} "
          release_url="repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}"
          response=''
          if response=$(gh api "$release_url" --include 2>&1); then
            draft=$(gh api "$release_url" --jq .draft)
            [ "$draft" = true ] || fail 'release became published during attestation'
            release_id=$(gh api "$release_url" --jq .id)
            assets_url="repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets"
            asset_names=$(gh api "$assets_url" --paginate --jq '.[].name')
            while IFS= read -r name; do
              [ -n "$name" ] || continue
            case "$expected_joined" in
              *" $name "*) ;;
              *) fail "unexpected draft asset $name" ;;
              esac
            done <<EOF
          $asset_names
          EOF
          else
            printf '%s\n' "$response" >&2
            fail 'release draft disappeared before upload'
          fi
          assets=()
          for name in "${expected[@]}"; do assets+=(".cache/release/$name"); done
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          release_id=$(gh api "$release_url" --jq .id)
          assets_url="repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets"
          asset_names=$(gh api "$assets_url" --paginate --jq '.[].name')
          count=0
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            case "$expected_joined" in
              *" $name "*) ;;
              *) fail "unexpected post-upload asset $name" ;;
            esac
            count=$((count + 1))
          done <<EOF
          $asset_names
          EOF
          [ "$count" -eq 13 ] || fail "post-upload release has $count assets, expected 13"
          for name in "${expected[@]}"; do
            found=0
            while IFS= read -r candidate; do
              [ "$candidate" = "$name" ] && found=1
            done <<EOF
          $asset_names
          EOF
            [ "$found" -eq 1 ] || fail "post-upload release is missing $name"
            remote=$(gh api "$assets_url" --paginate --jq ".[] | select(.name == \"$name\") | .digest")
            [ -n "$remote" ] || fail "missing GitHub digest for $name"
            remote=${remote#sha256:}
            local=$(sha256sum ".cache/release/$name" | cut -d ' ' -f1)
            [ "$remote" = "$local" ] || fail "post-upload digest mismatch for $name"
          done
          gh release edit "$GITHUB_REF_NAME" --draft=false
