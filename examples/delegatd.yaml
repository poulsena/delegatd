version: 1

store:
  kind: sqlite
  config:
    path: ./state.db

connectors:
  github-main:
    kind: github
    config:
      app_id: 123456
      private_key_file: ./github-app.pem

workspace_providers:
  docker-local:
    kind: docker
    config: {}

agent_runtimes:
  omp-primary:
    kind: omp
    config: {}

resources:
  api-service:
    kind: repository
    connector: github-main
    config:
      external_ref: acme/api-service

policy:
  actions:
    change_request.open: deny
  protected_paths: []
